<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My AI Chatbot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
  background: #fff;
  padding: 16px 24px;
  border-bottom: 1px solid #e5e5e5;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#new-chat {
  padding: 8px 16px;
  font-size: 14px;
  background: #e5e5e5;
  color: #111;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
  }
  .ai {
    align-self: flex-start;
    background: #fff;
    color: #111;
    border: 1px solid #e5e5e5;
  }
  footer {
    padding: 16px 24px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
    display: flex;
    gap: 12px;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #2563eb; }
  button {
    padding: 12px 24px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
  <span>🦙 My Local AI</span>
  <span id="msg-count">Messages: 0</span>
  <button id="new-chat">New Chat</button>
</header>
  <div id="chat"></div>
  <footer>
<select id="personality">
  <option value="assistant">Assistant</option>
  <option value="tutor">Tutor</option>
  <option value="interviewer">Interviewer</option>
  <option value="reviewer">Code Reviewer</option>
</select><input id="input" placeholder="Type your message..." autocomplete="off" />
    <button id="send">Send</button>
  </footer>


<script>
  const personality = document.getElementById("personality"); 
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const newChat = document.getElementById("new-chat");
  const msgCount = document.getElementById("msg-count");
  
  let history = [];
  function updateCount() {
  msgCount.textContent = "Messages: " + history.length;
}
 

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send.disabled = true;

    addMsg(text, "user");
    const aiDiv = addMsg("", "ai");

    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
body: JSON.stringify({
  message: text,
  history: history,
  personality: personality.value
})
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullReply = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      fullReply += decoder.decode(value);
      aiDiv.textContent = fullReply;
      chat.scrollTop = chat.scrollHeight;
    }

    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: fullReply });
    send.disabled = false;
    input.focus();
    updateCount(); 
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
  newChat.addEventListener("click", () => {
  chat.innerHTML = "";
  history = [];
  input.value = "";
  input.focus();
});
input.focus();
</script>
</body>
</html>
